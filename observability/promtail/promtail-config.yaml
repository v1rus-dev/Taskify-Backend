server:
  http_listen_port: 9081
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: taskify-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: taskify
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            service: service
            request_id: request_id
            actor_id: actor_id
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms
            client_ip: client_ip
            user_agent: user_agent
      - timestamp:
          source: timestamp
          format: RFC3339
          action_on_failure: skip
      - labels:
          level:
          logger:
          service:
          actor_id:
          method:
          status_code:
