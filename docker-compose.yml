name: taskify-backend

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - admin

  api:
    build: .
    volumes:
      - ./python-project/app:/app/app
      - app_logs:/app/logs
    ports:
      - "9080:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - LOG_FILE=/app/logs/api.log

  admin:
    build: .
    command: ["uvicorn", "admin_app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./python-project/app:/app/app
      - ./python-project/admin_app:/app/admin_app
      - app_logs:/app/logs
    ports:
      - "8082:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - LOG_FILE=/app/logs/admin.log
      - API_LOG_FILE=/app/logs/api.log

  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "8083:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:latest
    container_name: redis_container
    command:
      - "sh"
      - "-c"
      - "printf 'user default off\\nuser %s on >%s ~* +@read +@write +@connection +@fast -@dangerous -@admin -@slow\\n' \"$REDIS_USER\" \"$REDIS_USER_PASSWORD\" > /data/users.acl && exec redis-server --aclfile /data/users.acl"
    environment:
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -u redis://${REDIS_USER}:${REDIS_USER_PASSWORD}@localhost:6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
  pgadmin_data:
  redisdata:
  app_logs: