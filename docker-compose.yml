services:
  api:
    build: .
    volumes:
      - ./python-project/app:/app/app   # монтируем код для hot-reload
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    env_file:
      - .env
    ports:
      - "8082:8082"
    volumes:
      - /:/hostfs:ro
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "8081:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin  # пробел после дефиса важен

volumes:
  postgres_data:
  pgadmin_data:   # <-- добавляем сюда, иначе Docker создаст временный volume
