name: taskify-backend
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - admin

  api:
    build: .
    volumes:
      - ./python-project/app:/app/app
      - app_logs:/app/logs
    ports:
      - "9080:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - LOG_FILE=/app/logs/api.log

  admin:
    build: .
    command: ["uvicorn", "admin_app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./python-project/app:/app/app
      - ./python-project/admin_app:/app/admin_app
      - app_logs:/app/logs
    ports:
      - "8082:8000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - LOG_FILE=/app/logs/admin.log

  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    volumes:
      - ./observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - app_logs:/app/logs:ro

  grafana:
    image: grafana/grafana:11.1.4
    ports:
      - "3000:3000"
    depends_on:
      - loki
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    env_file:
      - .env
    ports:
      - "8084:8082"
    volumes:
      - /:/hostfs:ro
    restart: unless-stopped

  db:
    image: postgres:16
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    env_file:
      - .env
    ports:
      - "8083:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:latest
    container_name: redis_container
    command:
      - "sh"
      - "-c"
      - "printf 'user default off\\nuser %s on >%s ~* +@read +@write +@connection +@fast -@dangerous -@admin -@slow\\n' \"$REDIS_USER\" \"$REDIS_USER_PASSWORD\" > /data/users.acl && exec redis-server --aclfile /data/users.acl"
    environment:
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -u redis://${REDIS_USER}:${REDIS_USER_PASSWORD}@localhost:6379 ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  postgres_data:
  pgadmin_data:
  redisdata:
  app_logs:
  loki_data:
  grafana_data:
